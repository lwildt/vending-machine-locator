<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zigarettenautomaten Finder</title>
    <link rel="manifest" href="%BASE_URL%manifest.json" />
    <meta name="theme-color" content="#0f172a" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <h1>Zigarettenautomaten</h1>
        <div class="topbar-controls">
          <button id="live-toggle" type="button" aria-pressed="false">Live: Aus</button>
          <button id="follow-toggle" type="button" aria-pressed="false">Follow: Aus</button>
          <button id="search-button" type="button">In Bereich suchen</button>
        </div>
      </header>
      <main>
        <div id="map" aria-label="Karte mit Zigarettenautomaten"></div>
        <p id="status" role="status" aria-live="polite"></p>
      </main>
    </div>

    <script type="module" src="/src/main.js"></script>
    <script type="module">
      if ('serviceWorker' in navigator && import.meta.env.PROD) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register(`${import.meta.env.BASE_URL}sw.js`).catch(() => {});
        });
      }
    </script>
  </body>
</html>
